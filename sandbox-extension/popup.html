<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #e2e2e2;
      padding: 18px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #242424;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg { width: 17px; height: 17px; fill: #fff; }

    .header-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f0f0;
    }

    .header-sub {
      font-size: 10.5px;
      color: #6b6b6b;
      margin-top: 2px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .section { margin-bottom: 14px; }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #7a7a7a;
      margin-bottom: 9px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 9px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
      margin-bottom: 8px;
    }

    .toggle-row:hover { background: #222; border-color: #383838; }

    .toggle-row.active {
      background: #0b2116;
      border-color: #1a5c34;
    }

    .toggle-left {
      display: flex;
      align-items: center;
      gap: 9px;
      pointer-events: none;
    }

    .toggle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a3a3a;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .toggle-row.active .toggle-dot {
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: #b0b0b0;
      transition: color 0.15s;
      pointer-events: none;
    }

    .toggle-row.active .toggle-label { color: #4ade80; }

    .toggle-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      pointer-events: none;
      background: #242424;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid #333;
    }

    .toggle-row.active .toggle-badge {
      color: #4ade80;
      background: #0e2d1c;
      border-color: #1e6638;
    }

    .hint {
      font-size: 11px;
      color: #5e5e5e;
      line-height: 1.5;
      margin-top: 4px;
      padding-left: 2px;
    }

    .status {
      font-size: 11px;
      color: #5e5e5e;
      margin-top: 10px;
      min-height: 15px;
      line-height: 1.5;
      padding-left: 2px;
    }

    .status.ok { color: #7dba9e; }
    .status.err { color: #f87171; }

    .divider {
      height: 1px;
      background: #1e1e1e;
      margin: 14px 0;
    }

    .action-btn {
      width: 100%;
      padding: 10px 14px;
      background: #134e4a;
      border: 1px solid #0f766e;
      color: #5eead4;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      transition: background 0.12s;
    }

    .action-btn:hover { background: #115e59; }

    .action-btn-alt {
      margin-top: 8px;
      background: #1c1c1c;
      border-color: #2e2e2e;
      color: #b0b0b0;
    }

    .action-btn-alt:hover {
      background: #242424;
      color: #d8d8d8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
      </svg>
    </div>
    <div>
      <div class="header-name">Sandbox Solver</div>
      <div class="header-sub">Code labs only</div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Auto Solve</div>
    <div class="toggle-row" id="autoSolveToggle">
      <div class="toggle-left">
        <div class="toggle-dot"></div>
        <span class="toggle-label">Enable Sandbox Solver</span>
      </div>
      <span class="toggle-badge" id="toggleBadge">Off</span>
    </div>
    <div class="toggle-row" id="autoRunToggle">
      <div class="toggle-left">
        <div class="toggle-dot"></div>
        <span class="toggle-label">Click Run after fill</span>
      </div>
      <span class="toggle-badge" id="autoRunBadge">Off</span>
    </div>
    <p class="hint">Detects Monaco / CodeMirror / Ace / Run sandboxes. Uses the same local AI backend as Autopilot (localhost:8000).</p>
  </div>

  <div class="divider"></div>

  <div class="section">
    <button class="action-btn" id="solveNowBtn">Solve sandboxes on this page</button>
    <button class="action-btn action-btn-alt" id="copySolutionsBtn">Generate solutions to copy</button>
    <div class="status" id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
